##
## AppGate ZTNA demo -- JSON extraction only
##
## THIS FILE IS OPTIONAL. The dashboard's field mapping lives entirely in the
## `appgate_lf` macro (macros.conf), which needs no props.conf at all -- it only
## needs the raw JSON to be extracted into fields.
##
## Check whether you already have that:
##
##     index=appgate | head 1 | table sourcetype, hostname, daemon, log.event_type
##
##   - hostname / daemon / log.event_type all populated  -> extraction is
##     working. You can skip this file entirely.
##   - all null, and _raw shows the JSON               -> extraction is off.
##     Set KV_MODE below, with the stanza renamed to YOUR sourcetype (the
##     `sourcetype` column from that same search).
##
## Field aliases were deliberately REMOVED from this file. They keyed on
## sourcetype, so a stanza-name mismatch silently produced zero rows in every
## panel with no error -- the same symptom as having no data. Two competing
## definitions of `appliance` is also a debugging trap. The macro is the single
## source of truth now.


# =====================================================================
# Feed A -- AppGate LogForwarder (cz-logd)
#
# RENAME THIS STANZA to match your actual sourcetype before it does anything.
#
# Raw shape (confirmed against a live event) -- note hostname, daemon, and
# timestamp are TOP-LEVEL, and only the remainder is nested under "log":
#
#   {"version":2, "date":"Aug  4 19:07:28",
#    "timestamp":"2026-08-04T19:07:28.345Z",
#    "hostname":"10.10.100.50", "daemon":"cz-vpnd",
#    "log":{"action":"allow", "event_type":"ip_access", ...}}
# =====================================================================
[appgate:logforwarder]
KV_MODE = json

# --- Timestamp note -------------------------------------------------------
# These events carry TWO timestamps: a syslog-style "date" ("Aug  4 19:07:28",
# no year, no timezone) and an ISO-8601 "timestamp" ("2026-08-04T19:07:28.345Z").
# "date" appears FIRST in the raw string, so Splunk's automatic timestamp
# detection tends to pick it -- and because it carries no timezone, events can
# land offset by your input's TZ, which shifts every panel on the dashboard.
#
# Uncomment to pin extraction to the unambiguous UTC field. Verify first with:
#   index=appgate | eval real=strftime(strptime('log.timestamp',"%Y-%m-%dT%H:%M:%S.%3NZ"),"%F %T") | table _time, real, date, timestamp
# If _time and real disagree, uncomment these:
#
# TIME_PREFIX = \"timestamp\":\"
# TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
# TZ = UTC
# MAX_TIMESTAMP_LOOKAHEAD = 30


# =====================================================================
# Feed B -- Controller API poller
#
# *** NOT USED. *** Inert with no appgate:api data in the index. Retained so
# the poller upgrade path stays available -- see README, "What the poller would
# add". The nested-object aliases below are kept because the poller's records
# arrive dotted and the dashboard panels for it referenced these short names.
# =====================================================================
[appgate:api]
KV_MODE = json
FIELDALIAS-ag_api_net = "network.rxSpeed" AS rx_speed "network.txSpeed" AS tx_speed "network.busiestNic" AS busiest_nic
FIELDALIAS-ag_api_appliance = "appliance.details" AS appliance_details "gateway.numberOfSessions" AS gw_sessions
