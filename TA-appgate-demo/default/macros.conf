##
## AppGate ZTNA -- base search macros
##
## `appgate_lf` is the ONLY object the dashboard depends on for data. It does the
## index selection AND all field mapping, so there is no dependency on sourcetype
## naming or on field aliases in props.conf.
##
## PORTING THIS TO ANOTHER COLLECTIVE
## ----------------------------------
## There is exactly ONE line to edit: `appgate_index` below. Everything else --
## every panel, every filter, every default -- discovers its values from your own
## data at search time. No usernames, appliance hostnames, or entitlement names
## are hardcoded anywhere in the dashboard or in this file.
##
## WHY THE MAPPING LIVES HERE, NOT IN props.conf
## ---------------------------------------------
## props.conf FIELDALIAS stanzas key on sourcetype. If the sourcetype doesn't
## match exactly, every alias silently fails to apply and every panel returns
## zero rows with no error -- indistinguishable from "no data". Doing the
## mapping in the macro removes that failure mode.
##
## THE RAW EVENT SHAPE (confirmed against live events from 6 daemons)
## -----------------------------------------------------------------
##   {"version":2, "date":"Aug  5 18:34:49", "timestamp":"2026-08-05T18:34:49.040Z",
##    "hostname":"203.0.113.10", "daemon":"cz-vpnd",
##    "log":{"action":"allow", "event_type":"ip_access", "rule_name":"...", ...}}
##
## TWO DIFFERENT HOSTNAMES -- DO NOT COALESCE THEM.
##   top-level  hostname  = the APPLIANCE (gateway IP, or controller FQDN)
##   log.hostname         = the CLIENT DEVICE (e.g. "ip-10-10-10-46"), present on
##                          authentication_failed and similar
## An earlier version coalesced log.hostname first, which silently populated the
## appliance column with client device names. `appliance` now reads ONLY the
## top-level field; client device names go to `device_hostname`.
##
## DAEMONS SEEN: cz-controllerd (auth, authorization, admin audit, admin
## messages), cz-vpnd (ip_access, tunnel_*, acl_rules_update), cz-sessiond
## (session_*, *_token_*, device_claims_*), cz-appliance (ssh_access_failed).
## NOT cz-configd and NOT sshd -- the CrowdStrike parser expected those names.
##
## ARRAY FIELDS -- AND THE `{}` SUFFIX TRAP
## ----------------------------------------
## Splunk's JSON extraction names an ARRAY field with a trailing `{}`. The raw
## key log.policy_names extracts as the FIELD `log.policy_names{}`, which after
## `rename log.* AS *` becomes `policy_names{}` -- so a panel searching
## `policy_names=*` matches nothing and renders BLANK WITH NO ERROR. This is the
## same silent-blank failure class as the sourcetype-alias problem above.
##
## Stage 3 (`rename "*{}" AS "*"`) strips the suffix from every array field, so
## queries use the clean name. It is a NO-OP if your extraction doesn't add the
## suffix, so it is safe either way -- do not remove it as "redundant".
##
## Array fields, usable after stage 3 (multivalue -- mvexpand to aggregate per
## element, or stats treats the whole array as one opaque value):
##   policy_names, entitlement_names, site_names   <- on authorization_succeeded
##   successful_condition_names,
##   successful_entitlement_names                  <- on entitlement_token_evaluated
##   admin_role_names                              <- on admin_authorization_succeeded
## These are why per-user POLICY and ENTITLEMENT ASSIGNMENT is available from the
## LogForwarder after all, with no API poller.
##
## Arrays of OBJECTS are not covered and don't need to be: log.dns_settings
## extracts as `log.dns_settings{}.domain`, which does not END in `{}` and is
## left alone. No panel reads one.
##
## Requires JSON field extraction to be active (KV_MODE=json or an automatic
## _json / HEC extraction). If `index=appgate | head 1 | table log.event_type`
## comes back empty, fix that first -- no macro can recover unextracted fields.
##
## PIPELINE ORDER MATTERS:
##   1. eval appliance  -- read log.hostname and hostname while both are distinct
##   2. rename log.* AS *  -- flatten the nested block
##   3. rename "*{}" AS "*"  -- strip Splunk's array suffix (see above)
##   4. eval <aliases>  -- friendly names for the flattened fields
##
## Because this macro CONTAINS PIPES, panels must filter with an explicit
## `| search ...` after it. `appgate_lf event_type=ip_access` is a syntax error;
## `appgate_lf` | search event_type=ip_access` is correct.

## ---------------------------------------------------------------------------
## THE ONE LINE TO EDIT WHEN PORTING.
##
## Whatever selects your LogForwarder events goes here. Common alternatives:
##   index=appgate
##   index=network sourcetype=appgate:logforwarder
##   index=* sourcetype=appgate:*            <- slow, but works while you find it
##
## Find yours with:  | tstats count where index=* by index, sourcetype
## ---------------------------------------------------------------------------
[appgate_index]
definition = index=appgate
iseval = 0

[appgate_lf]
definition = `appgate_index` | eval appliance=hostname, device_hostname=coalesce('log.hostname', 'log.device_claims.os.hostname') | rename log.* AS * | rename "*{}" AS "*" | eval ag_user=coalesce(distinguished_name_user, username), ag_ou=distinguished_name_ou, entitlement=rule_name, ag_action=action, ag_status=status, ag_reason=coalesce(reason, drop_reason), dest_ip=destination_ip, dest_port=destination_port, ag_protocol=protocol, ag_bytes=packet_size, ag_client_ip=client_ip, ag_command=command, ag_lat='geoip.location.lat', ag_lon='geoip.location.lon', ag_country='geoip.country_name', ag_city='geoip.city_name', ag_region='geoip.region_name', auth_type=authentication_type, session=session_id, exec_ms=execution_ms, device_os='device_claims.os.name', device_platform='device_claims.os.platform', device_family='device_claims.os.family', device_client_type='device_claims.clientType', device_profile='device_claims.profileName', device_firewall='device_claims.isFirewallEnabled', device_user_admin='device_claims.isUserAdmin', device_stig='device_claims.stig', client_version=coalesce('device_claims.clientVersion', client_version), risk_score='scripted_user_claims.riskScore', clearance='scripted_user_claims.clearance', device_trust='scripted_user_claims.deviceTrust', geo_location='scripted_user_claims.geoLocation', home_base='scripted_user_claims.homeBase', user_role='scripted_user_claims.role', mfa_provided='scripted_user_claims.mfaProvided', ia_training='scripted_user_claims.iaTrainingCompleted', first_name='user_claims.firstName', last_name='user_claims.lastName', idp='user_claims.ag.identityProviderName', msg_level='admin_message.level', msg_category='admin_message.category', msg_text='admin_message.message', msg_source='admin_message.source'
iseval = 0

## ---------------------------------------------------------------------------
## SELF-SEEDING IDENTITY SELECTION
##
## The dashboard's User / User A / User B inputs are free-text boxes that default
## to `*`. These three macros turn "whatever is in the box" into a concrete
## identity picked from YOUR data, so the Investigate and Compare tabs are
## populated the moment the dashboard loads, on any collective, with nothing
## hardcoded.
##
## All three understand the same three input shapes:
##   `*` or empty  -> pick automatically, busiest identity first
##   `alice`       -> that exact identity
##   `*loadgen*`   -> busiest identity matching the pattern
##
## HOW THE PATTERN MATCH WORKS. Splunk's `like()` uses SQL wildcards (`%`, `_`),
## not shell ones, so the token is translated with replace(..., "[*]", "%"). The
## character class is deliberate -- `"\*"` would need backslash escaping that
## conf-file parsing can eat. Note `_` is a single-character wildcard to like(),
## so a username containing an underscore can match slightly more than you typed;
## harmless here because the result is only ever used to pick a starting identity.
##
## ARGUMENTS AND COMMAS. These are invoked as `appgate_pair("$user_a$","$user_b$")`
## -- Splunk splits macro arguments on commas, so an identity containing a literal
## comma (a full DN, say) would break the call. That is a loud parse error, not a
## silent empty panel. `ag_user` resolves to distinguished_name_user, which is the
## user component only, so this has not come up.
## ---------------------------------------------------------------------------

# Pick the TWO identities the Compare tab's head-to-head panels run against.
# Expands to a subsearch, so it is used as a search TERM:
#   `appgate_lf` | search event_type=ip_access `appgate_pair("$user_a$","$user_b$")`
#
# Ranking: explicitly-named User A first, then explicitly-named User B, then
# everything else by event volume, and take the top 2. So `*` / `*` compares the
# two busiest identities, one pinned name plus `*` compares that name against the
# busiest other, and two pinned names compare exactly those.
[appgate_pair(2)]
args = a, b
definition = [ search `appgate_lf` | search ag_user=* | stats count as ev by ag_user | eval pat_a=replace("$a$", "[*]", "%"), pat_b=replace("$b$", "[*]", "%"), bare_a=if("$a$"="*" OR "$a$"="", 1, 0), bare_b=if("$b$"="*" OR "$b$"="", 1, 0) | eval pin=case(bare_a=0 AND like(ag_user, pat_a), 0, bare_b=0 AND like(ag_user, pat_b), 1, true(), 2) | sort pin, - ev | head 2 | fields ag_user ]
iseval = 0

# Label each event's identity as slot "A" or slot "B". Runs mid-pipeline, after
# the pair filter:
#   ... `appgate_pair("$user_a$","$user_b$")` | `appgate_slot("$user_a$","$user_b$")`
#
# WHY THIS RE-RUNS THE RANKING INSTEAD OF READING IT OFF THE EVENTS. Slot A must
# mean the same identity in all four head-to-head panels, and those four panels
# each filter to a DIFFERENT event type. Deciding "A is the top-ranked identity
# present here" would break the moment one of the pair has no
# authorization_succeeded events: the other would be relabelled A, and
# Entitlement Differential would credit its rows to the wrong column of the
# head-to-head table beside it. So A is resolved by the same `head 1` over the
# whole window that `appgate_pair` ranks with, independent of the panel.
#
# The append/eventstats/where dance is how you get a scalar out of a subsearch:
# `append` adds one row carrying the answer, `eventstats` broadcasts it to every
# real event, `where isnull(slot_seed)` then drops the carrier row.
[appgate_slot(2)]
args = a, b
definition = append [ search `appgate_lf` | search ag_user=* | stats count as ev by ag_user | eval pat_a=replace("$a$", "[*]", "%"), pat_b=replace("$b$", "[*]", "%"), bare_a=if("$a$"="*" OR "$a$"="", 1, 0), bare_b=if("$b$"="*" OR "$b$"="", 1, 0) | eval pin=case(bare_a=0 AND like(ag_user, pat_a), 0, bare_b=0 AND like(ag_user, pat_b), 1, true(), 2) | sort pin, - ev | head 1 | eval slot_seed=ag_user | fields slot_seed ] | eventstats values(slot_seed) as user_a | where isnull(slot_seed) | eval slot=if(ag_user=user_a, "A", "B") | fields - slot_seed, user_a
iseval = 0

# Pick the ONE identity the Investigate User tab profiles. Also a subsearch term.
#
# The appendpipe is a deliberate guard. A subsearch that returns no rows
# contributes NO filter terms, so a typo in the User box would silently widen
# Identity Summary to every user at once and present the merged result as one
# person. The sentinel forces an impossible filter instead, so a typo shows an
# empty panel -- wrong-and-obvious beats wrong-and-plausible.
[appgate_top_user(1)]
args = u
definition = [ search `appgate_lf` | search ag_user=* | stats count as ev by ag_user | eval pat=replace("$u$", "[*]", "%") | where like(ag_user, pat) | sort - ev | head 1 | fields ag_user | appendpipe [ stats count as n | where n=0 | eval ag_user="__no_identity_matched__" | fields ag_user ] ]
iseval = 0

## ---------------------------------------------------------------------------
## Feed B -- Controller API poller.
##
## *** NOT USED BY THE CURRENT DASHBOARD *** -- Collective Health is
## LogForwarder-only. Retained (with the two snapshot macros) so the poller
## upgrade path stays available without re-deriving these definitions.
##
## If you DO enable the poller, note that `appgate_lf` above matches the whole
## appgate index. Add a sourcetype filter to both macros at that point so the
## two feeds stay separable.
## ---------------------------------------------------------------------------

[appgate_api]
definition = `appgate_index` sourcetype=appgate:api
iseval = 0

# Reduce a poller snapshot feed to its most recent sweep.
#
# entitlement_grant and entitlement_catalog are FULL RE-SHIPS on a heartbeat,
# not deltas. Counting them without this reduction multiplies every result by
# the number of sweeps in the time window -- a 24h window at a 60s cadence
# inflates user counts by ~1440x.
[appgate_latest_snapshot]
definition = eventstats max(snapshot_ts) as _latest_snapshot | where snapshot_ts=_latest_snapshot | fields - _latest_snapshot
iseval = 0

[appgate_latest_catalog]
definition = eventstats max(catalog_ts) as _latest_catalog | where catalog_ts=_latest_catalog | fields - _latest_catalog
iseval = 0
